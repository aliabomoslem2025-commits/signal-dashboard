services:
  signal-dashboard:
    build: .
    container_name: signal-dashboard
    restart: unless-stopped
    environment:
      # Set this to the private address reachable from the dashboard container.
      # Example: http://192.168.10.20:8080
      SIGNAL_SERVER_UPSTREAM: ${SIGNAL_SERVER_UPSTREAM:-http://host.docker.internal:8080}
    ports:
      - "${DASHBOARD_PORT:-8090}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE