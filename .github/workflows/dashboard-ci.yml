name: Signal LAN Dashboard CI

on:
  push:
    branches:
      - main
      - feat/local-lan-production-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  dashboard:
    name: Validate dashboard assets and Compose deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check dashboard JavaScript syntax
        run: node --check app.js
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
